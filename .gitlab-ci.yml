before_script:
  - export COMPOSER_ALLOW_SUPERUSER=1
  - export PATH="/root/.nvm/versions/node/v21.7.3/bin/node:$PATH"

stages:          
  - build

build-job:       
  stage: build
  tags:
    - grh
  only:
    - main
  script:
    - date
    - pwd
    - ls -la
    - node -v
    - npm install
    - composer install

  
